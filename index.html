<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6f0e8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="뭐입었지" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<title>뭐입었지</title>
<style>
:root{--bg:#f6f0e8;--card:#fffdfa;--ink:#22201e;--muted:#958e87;--line:#e8e0d7;--accent:#d98361;--shadow:0 8px 24px rgba(60,42,25,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:540px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 4px 12px}.brand{font-family:"Apple SD Gothic Neo",sans-serif;font-weight:800;font-size:27px;letter-spacing:-1.5px}.brand:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#f4bd4b;margin-left:7px;vertical-align:4px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.gear{border:0;background:transparent;font-size:20px;padding:4px}.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(90,70,50,.035)}.toolbar{padding:15px 16px 12px}.monthrow{display:flex;justify-content:space-between;align-items:center}.monthtitle{font-size:18px;font-weight:800}.navbtn{border:0;background:transparent;font-size:24px;color:#807870;padding:4px 10px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#efe7de;border-radius:12px;padding:3px;margin-top:12px}.seg button{border:0;background:transparent;padding:8px;border-radius:9px;color:#756d65;font-weight:700}.seg button.active{background:#fff;box-shadow:0 1px 5px rgba(60,42,25,.08);color:#26221f}.content{margin-top:12px}.weekdays,.monthgrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{font-size:11px;text-align:center;color:#9a938c;padding:8px 0}.monthgrid{gap:5px;padding:0 10px 14px}.daycell{position:relative;aspect-ratio:.78;border-radius:10px;overflow:hidden;background:#eee7de;display:flex;align-items:center;justify-content:center;border:1px solid #ede5dc}.daycell.empty{background:transparent;border-color:transparent}.daynum{position:absolute;left:5px;top:4px;z-index:2;font-size:10px;background:rgba(255,255,255,.82);padding:1px 4px;border-radius:8px}.daycell.today{outline:2px solid var(--accent);outline-offset:1px}.daycell img{width:100%;height:100%;object-fit:cover}.plus{font-size:22px;color:#b6ada4}.badge{position:absolute;right:4px;bottom:4px;background:rgba(30,27,25,.78);color:white;border-radius:9px;font-size:9px;padding:2px 5px}.weeklist,.daydetail{display:flex;flex-direction:column;gap:10px;padding:12px}.weekitem{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}.datecol{text-align:center;padding-top:7px}.dow{font-size:11px;color:#9c948d}.datebig{font-size:22px;font-weight:800}.lookstrip{display:flex;gap:8px;overflow:auto;scroll-snap-type:x mandatory;padding-bottom:2px}.lookcard{min-width:72%;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:#eee7de;position:relative}.lookcard img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.lookmemo{padding:9px 10px;font-size:12px;background:#fff}.emptyweek{border:1px dashed #d9cfc5;border-radius:15px;padding:18px;text-align:center;color:#9e958d}.detailhead{display:flex;align-items:center;gap:10px}.back{border:0;background:transparent;font-size:24px}.detailtitle{font-size:17px;font-weight:800}.hero{border-radius:20px;overflow:hidden;background:#eee7de}.hero img{width:100%;display:block;max-height:58dvh;object-fit:cover}.memo{padding:13px 4px 0}.memo textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;resize:none;background:#fffdfb;font:inherit;min-height:82px}.actions{display:flex;gap:8px;margin-top:10px}.btn{flex:1;border:0;border-radius:14px;padding:12px;font-weight:800;background:#24211f;color:#fff}.btn.secondary{background:#eee7df;color:#4d4741}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumb{width:64px;height:80px;border-radius:10px;overflow:hidden;border:2px solid transparent;flex:0 0 auto}.thumb.active{border-color:#222}.thumb img{width:100%;height:100%;object-fit:cover}.recordsheet{padding:18px}.drop{border:1.5px dashed #d6cbbf;border-radius:18px;padding:26px 16px;text-align:center;background:#fbf7f2}.filebtn{display:block;background:#25211f;color:white;border-radius:13px;padding:12px 16px;font-weight:800;margin:12px auto 0;width:max-content}.filebtn input{display:none}.recordsheet textarea{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;min-height:90px;background:white}.preview{width:100%;max-height:52dvh;object-fit:contain;border-radius:16px;margin-top:12px;display:none}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,240,232,0),#f6f0e8 22%)}.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(255,253,250,.95);border:1px solid #e9e1d8;box-shadow:0 6px 18px rgba(55,38,20,.08);border-radius:18px;padding:6px}.bar button{border:0;background:transparent;border-radius:13px;padding:10px 6px;font-weight:800;color:#8d847b}.bar button.active{background:#2b2724;color:white}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#2d2926;color:#fff;padding:9px 13px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.hint{font-size:11px;color:#9c948c;text-align:center;margin-top:10px}.installbox{padding:14px 16px;margin-top:12px;font-size:12px;line-height:1.55}.installbox b{font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">뭐입었지</div><div class="sub">매일의 착장을 기록해요</div></div><button class="gear" id="installInfo">⚙︎</button></header>
  <section id="calendarView">
    <div class="card toolbar"><div class="monthrow"><button class="navbtn" id="prev">‹</button><div class="monthtitle" id="periodTitle"></div><button class="navbtn" id="next">›</button></div><div class="seg"><button data-mode="day">일</button><button data-mode="week">주</button><button class="active" data-mode="month">월</button></div></div>
    <div id="monthView" class="card content"><div class="weekdays"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div><div class="monthgrid" id="monthGrid"></div></div>
    <div id="weekView" class="card content hidden"><div class="weeklist" id="weekList"></div></div>
    <div id="dayView" class="card content hidden"><div class="daydetail" id="daySummary"></div></div>
  </section>
  <section id="detailView" class="hidden"><div class="card daydetail"><div class="detailhead"><button class="back" id="backBtn">‹</button><div class="detailtitle" id="detailTitle"></div></div><div id="detailEmpty" class="emptyweek hidden">아직 기록이 없어요.</div><div id="detailFilled"><div class="hero"><img id="heroImg" alt="착장 사진"></div><div class="memo"><textarea id="memoEdit" placeholder="간단한 메모 (선택)"></textarea><div class="actions"><button class="btn secondary" id="exportBtn">내보내기</button><button class="btn" id="saveMemoBtn">메모 저장</button></div><div class="thumbs" id="thumbs"></div></div></div><button class="btn" id="addToDate">+ 착장 추가</button></div></section>
  <section id="recordView" class="hidden"><div class="card recordsheet"><div class="detailhead"><button class="back" id="recordBack">‹</button><div><div class="detailtitle" id="recordTitle">오늘의 착장 기록</div><div class="sub" id="recordDate"></div></div></div><div class="drop"><div>📷 사진을 찍거나 사진첩에서 선택하세요</div><label class="filebtn">사진 선택 / 촬영<input id="photoInput" type="file" accept="image/*" capture="environment"></label></div><img class="preview" id="preview"><textarea id="recordMemo" placeholder="메모 (선택) — 예: 저녁 약속, 재킷 추가"></textarea><button class="btn" id="saveRecord">저장</button><div class="hint">사진은 이 기기의 브라우저 저장공간(IndexedDB)에 저장됩니다.</div></div></section>
  <section id="settingsView" class="hidden"><div class="card installbox"><b>홈 화면에 추가하기</b><br>iPhone: Safari 공유 버튼 → ‘홈 화면에 추가’<br>Android: Chrome 메뉴 → ‘앱 설치’ 또는 ‘홈 화면에 추가’<br><br><b>데이터 안내</b><br>v1은 사진과 메모를 이 기기에 저장합니다. 브라우저 데이터 삭제나 기기 변경 시 사라질 수 있으니 중요한 사진은 ‘내보내기’를 사용하세요.<br><button class="btn secondary" id="settingsBack" style="margin-top:12px">돌아가기</button></div></section>
</div>
<div class="bottom"><div class="bar"><button id="calendarTab" class="active">▦ 캘린더</button><button id="recordTab">＋ 기록하기</button></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const today=new Date(); let cursor=new Date(today.getFullYear(),today.getMonth(),today.getDate()); let mode='month'; let selectedDate=key(today); let selectedLook=0; let recordTarget=selectedDate; let pendingFile=null;
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function koDate(k){const d=fromKey(k);return `${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`}
function mondayIndex(jsDay){return (jsDay+6)%7}
function startOfWeek(d){const x=new Date(d);x.setDate(x.getDate()-mondayIndex(x.getDay()));x.setHours(0,0,0,0);return x}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
const DB={
  db:null,
  fallback:false,
  async open(){
    if(!('indexedDB' in window)){this.fallback=true;return}
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('mwoipji-db',1);
        r.onupgradeneeded=()=>{
          const db=r.result;
          if(!db.objectStoreNames.contains('looks')){
            const st=db.createObjectStore('looks',{keyPath:'id'});
            st.createIndex('date','date');
          }
        };
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>rej(r.error);
      });
    }catch(e){
      console.warn('IndexedDB unavailable, using localStorage fallback',e);
      this.fallback=true;
    }
  },
  async all(){
    if(this.fallback){
      const raw=JSON.parse(localStorage.getItem('mwoipji-fallback')||'[]');
      return Promise.all(raw.map(async x=>({...x,photo:await dataUrlToBlob(x.photoData)}))).then(v=>v.sort((a,b)=>a.createdAt-b.createdAt));
    }
    return new Promise((res,rej)=>{const r=this.db.transaction('looks').objectStore('looks').getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>a.createdAt-b.createdAt));r.onerror=()=>rej(r.error)});
  },
  async byDate(date){const all=await this.all();return all.filter(x=>x.date===date).sort((a,b)=>a.createdAt-b.createdAt)},
  async put(v){
    if(this.fallback){
      const arr=JSON.parse(localStorage.getItem('mwoipji-fallback')||'[]');
      const photoData=await blobToDataUrl(v.photo);
      const plain={id:v.id,date:v.date,memo:v.memo||'',photoData,createdAt:v.createdAt};
      const i=arr.findIndex(x=>x.id===v.id); if(i>=0)arr[i]=plain; else arr.push(plain);
      localStorage.setItem('mwoipji-fallback',JSON.stringify(arr)); return;
    }
    return new Promise((res,rej)=>{const r=this.db.transaction('looks','readwrite').objectStore('looks').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
};
function blobToDataUrl(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function dataUrlToBlob(dataUrl){const r=await fetch(dataUrl);return r.blob()}
let cache=[];
async function refresh(){try{cache=await DB.all()}catch(e){console.warn(e);cache=[]}render()}
function looksOn(k){return cache.filter(x=>x.date===k)}
function imgURL(blob){return URL.createObjectURL(blob)}
function setMain(view){['calendarView','detailView','recordView','settingsView'].forEach(id=>$('#'+id).classList.add('hidden'));$('#'+view).classList.remove('hidden');$('#calendarTab').classList.toggle('active',view==='calendarView');$('#recordTab').classList.toggle('active',view==='recordView')}
function render(){ $$('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); $('#monthView').classList.toggle('hidden',mode!=='month');$('#weekView').classList.toggle('hidden',mode!=='week');$('#dayView').classList.toggle('hidden',mode!=='day'); if(mode==='month') renderMonth(); if(mode==='week') renderWeek(); if(mode==='day') renderDay(); }
function renderMonth(){const y=cursor.getFullYear(),m=cursor.getMonth();$('#periodTitle').textContent=`${y}년 ${m+1}월`;const grid=$('#monthGrid');grid.innerHTML='';const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();for(let i=0;i<mondayIndex(first.getDay());i++){const e=document.createElement('div');e.className='daycell empty';grid.append(e)}for(let d=1;d<=days;d++){const dt=new Date(y,m,d),k=key(dt),ls=looksOn(k),cell=document.createElement('button');cell.className='daycell'+(k===key(today)?' today':'');cell.style.padding=0;cell.style.border='';cell.innerHTML=`<span class="daynum">${d}</span>${ls[0]?`<img src="${imgURL(ls[0].photo)}">${ls.length>1?`<span class="badge">+${ls.length-1}</span>`:''}`:`<span class="plus">＋</span>`}`;cell.onclick=()=>openDate(k);grid.append(cell)}}
function weekDates(){const base=startOfWeek(cursor);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return d})}
function renderWeek(){const ds=weekDates();$('#periodTitle').textContent=`${ds[0].getMonth()+1}월 ${ds[0].getDate()}일 – ${ds[6].getMonth()+1}월 ${ds[6].getDate()}일`;const wrap=$('#weekList');wrap.innerHTML='';const names=['일','월','화','수','목','금','토'];ds.forEach(d=>{const k=key(d),ls=looksOn(k),row=document.createElement('div');row.className='weekitem';row.innerHTML=`<div class="datecol"><div class="dow">${names[d.getDay()]}</div><div class="datebig">${d.getDate()}</div></div><div>${ls.length?`<div class="lookstrip">${ls.map((x,i)=>`<div class="lookcard" data-i="${i}"><img src="${imgURL(x.photo)}"><div class="lookmemo">${escapeHtml(x.memo||'메모 없음')}</div></div>`).join('')}</div>`:`<div class="emptyweek">＋ 오늘의 착장 기록하기</div>`}</div>`;row.querySelectorAll('.lookcard').forEach(el=>el.onclick=()=>openDate(k,Number(el.dataset.i)));row.querySelector('.emptyweek')?.addEventListener('click',()=>startRecord(k));wrap.append(row)})}
function renderDay(){const k=key(cursor);$('#periodTitle').textContent=koDate(k);const ls=looksOn(k),wrap=$('#daySummary');wrap.innerHTML=ls.length?ls.map((x,i)=>`<div class="lookcard" style="min-width:100%" data-i="${i}"><img src="${imgURL(x.photo)}"><div class="lookmemo">${escapeHtml(x.memo||'메모 없음')}</div></div>`).join(''):`<div class="emptyweek">아직 기록이 없어요. ＋ 착장 기록하기</div>`;wrap.querySelectorAll('.lookcard').forEach(el=>el.onclick=()=>openDate(k,Number(el.dataset.i)));wrap.querySelector('.emptyweek')?.addEventListener('click',()=>startRecord(k))}
async function openDate(k,i=0){selectedDate=k;selectedLook=i;setMain('detailView');await renderDetail()}
async function renderDetail(){const ls=await DB.byDate(selectedDate);$('#detailTitle').textContent=koDate(selectedDate);const empty=!ls.length;$('#detailEmpty').classList.toggle('hidden',!empty);$('#detailFilled').classList.toggle('hidden',empty);if(empty)return;selectedLook=Math.min(selectedLook,ls.length-1);const x=ls[selectedLook];$('#heroImg').src=imgURL(x.photo);$('#memoEdit').value=x.memo||'';const th=$('#thumbs');th.innerHTML=ls.map((q,i)=>`<button class="thumb ${i===selectedLook?'active':''}" data-i="${i}"><img src="${imgURL(q.photo)}"></button>`).join('');th.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{selectedLook=Number(b.dataset.i);renderDetail()});$('#saveMemoBtn').onclick=async()=>{x.memo=$('#memoEdit').value.trim();await DB.put(x);await refresh();await renderDetail();toast('메모를 저장했어요')};$('#exportBtn').onclick=async()=>exportLook(x)}
function startRecord(k=key(today)){recordTarget=k;pendingFile=null;setMain('recordView');$('#recordDate').textContent=koDate(k);$('#recordMemo').value='';$('#photoInput').value='';$('#preview').style.display='none';}
async function exportLook(x){const f=new File([x.photo],`뭐입었지_${x.date}.jpg`,{type:x.photo.type||'image/jpeg'});if(navigator.share&&navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:'뭐입었지'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=imgURL(x.photo);a.download=f.name;a.click();toast('사진을 내보냈어요')}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$$('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('#prev').onclick=()=>{if(mode==='month'){cursor.setMonth(cursor.getMonth()-1)}else if(mode==='week'){cursor.setDate(cursor.getDate()-7)}else cursor.setDate(cursor.getDate()-1);cursor=new Date(cursor);render()};$('#next').onclick=()=>{if(mode==='month'){cursor.setMonth(cursor.getMonth()+1)}else if(mode==='week'){cursor.setDate(cursor.getDate()+7)}else cursor.setDate(cursor.getDate()+1);cursor=new Date(cursor);render()};$('#backBtn').onclick=()=>{setMain('calendarView');render()};$('#recordBack').onclick=()=>setMain('calendarView');$('#calendarTab').onclick=()=>{setMain('calendarView');render()};$('#recordTab').onclick=()=>startRecord(key(today));$('#addToDate').onclick=()=>startRecord(selectedDate);$('#photoInput').onchange=e=>{pendingFile=e.target.files?.[0]||null;if(pendingFile){$('#preview').src=imgURL(pendingFile);$('#preview').style.display='block'}};$('#saveRecord').onclick=async()=>{if(!pendingFile){toast('사진을 먼저 선택해주세요');return}const id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();await DB.put({id,date:recordTarget,memo:$('#recordMemo').value.trim(),photo:pendingFile,createdAt:Date.now()});await refresh();selectedDate=recordTarget;selectedLook=looksOn(recordTarget).length-1;setMain('detailView');await renderDetail();toast('착장을 기록했어요')};$('#installInfo').onclick=()=>setMain('settingsView');$('#settingsBack').onclick=()=>setMain('calendarView');
render(); DB.open().then(refresh).catch(()=>render()); if(location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
